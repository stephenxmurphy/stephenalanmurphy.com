name: One-shot portfolio structure cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-portfolio-structure.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch portfolio structure
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('script.js')
          text = path.read_text()

          old = """if (wordmark) {
            wordmark.textContent = 'Stephen Murphy';
            wordmark.setAttribute('aria-label', 'Stephen Murphy — back to top');
          }"""
          new = """if (wordmark) {
            wordmark.textContent = 'Stephen Murphy';
            wordmark.setAttribute('aria-label', 'Stephen Murphy — back to top');
            wordmark.href = '#';
          }"""
          if old not in text:
              raise SystemExit('wordmark block not found')
          text = text.replace(old, new, 1)

          text = text.replace(
              "University of Victoria Centre for Aerospace Research · Mechanical Engineering Intern",
              "Centre for Aerospace Research · Mechanical Engineering Intern"
          )

          old = """// Earlier work uses the same company-band convention. Consecutive projects at the same employer share one band.
          let previousEarlyCompany = '';
          document.querySelectorAll('.early-project').forEach((project) => {
            const roleLine = project.querySelector('.early-copy .role-line');
            if (!roleLine) return;
            const { company, role } = splitRole(roleLine.textContent);
            if (!company) return;

            if (company !== previousEarlyCompany) {
              const band = document.createElement('header');
              band.className = 'early-company-band';
              const companyName = document.createElement('h2');
              companyName.textContent = company;
              band.append(companyName);
              project.before(band);
            }

            previousEarlyCompany = company;
            if (role) roleLine.textContent = role;
          });"""
          new = """// Earlier work uses the same Company · Job Title band convention as the rest of the portfolio.
          let previousEarlyContext = '';
          document.querySelectorAll('.early-project').forEach((project) => {
            const roleLine = project.querySelector('.early-copy .role-line');
            if (!roleLine) return;
            const { company, role } = splitRole(roleLine.textContent);
            if (!company) return;

            const context = role ? `${company} · ${role}` : company;
            if (context !== previousEarlyContext) {
              const band = document.createElement('header');
              band.className = 'early-company-band';
              const companyName = document.createElement('h2');
              companyName.textContent = context;
              band.append(companyName);
              project.before(band);
            }

            previousEarlyContext = context;
            roleLine.remove();
          });"""
          if old not in text:
              raise SystemExit('academic band block not found')
          text = text.replace(old, new, 1)

          text = text.replace(
              "I am a named inventor on eight U.S. patents for this product, with one additional U.S. application pending; see the patents list below.",
              "I am a named inventor on eight granted U.S. patents in this product's patent family, with one additional U.S. application pending; see the patents list below."
          )
          text = text.replace(
              "Hair care appliance — 8 granted U.S. patents · 1 pending U.S. application",
              "Hair care appliance patent family — 8 granted U.S. patents · 1 pending U.S. application"
          )

          path.write_text(text)
          PY

      - name: Commit cleanup and remove one-shot workflow
        run: |
          rm .github/workflows/one-shot-portfolio-structure.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add script.js .github/workflows/one-shot-portfolio-structure.yml
          git commit -m 'Fix academic hierarchy and back-to-top link'
          git push
