name: Fix script syntax

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix JavaScript syntax and verify
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('script.js')
          s = p.read_text()
          old = "'I am a named inventor on eight granted U.S. patents in this product's patent family, with one additional U.S. application pending; see the patents list below.'"
          new = '"I am a named inventor on eight granted U.S. patents in this product\'s patent family, with one additional U.S. application pending; see the patents list below."'
          if old not in s:
              raise SystemExit('Target patent string not found')
          p.write_text(s.replace(old, new, 1))
          Path('.github/workflows/fix-script-syntax.yml').unlink()
          PY
          node --check script.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix portfolio JavaScript syntax"
          git push
