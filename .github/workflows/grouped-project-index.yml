name: Group project index and academic company bands

on:
  push:
    branches: [main]
    paths:
      - '.github/trigger-grouped-project-index.txt'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Update portfolio
        run: |
          python -m pip install --quiet pillow
          python .github/scripts/grouped_project_index.py
          node --check script.js
          rm -f .github/workflows/grouped-project-index.yml .github/scripts/grouped_project_index.py .github/trigger-grouped-project-index.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Group project index and restore academic company bands"
          git push
